name: Backend and contracts
on:
  push:
    branches: ["feat/**", main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: breathewise
          POSTGRES_PASSWORD: breathewise
          POSTGRES_DB: breathewise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U breathewise"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install uv
      - run: make setup
      - run: make check
      - run: make test-postgres
        env:
          BREATHEWISE_TEST_POSTGRES_URL: postgresql+psycopg://breathewise:breathewise@127.0.0.1:5432/breathewise
      - run: uv run --locked python -m build --wheel --outdir work/dist
