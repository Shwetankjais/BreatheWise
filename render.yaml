services:
  - type: web
    name: breathewise-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathewise-db
          property: connectionString
      - key: DATA_MODE
        value: live
      - key: BREATHEWISE_AUTO_REFRESH
        value: "1"
      - key: WEB_ORIGIN
        value: https://shwetankjais.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: PORT
        value: 8000

databases:
  - name: breathewise-db
    databaseName: breathewise
    user: breathewise
    plan: free
    region: oregon
    postgresMajorVersion: 16
