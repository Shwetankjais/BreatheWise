services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: breathewise
      POSTGRES_PASSWORD: breathewise
      POSTGRES_DB: breathewise
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breathewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://breathewise:breathewise@db:5432/breathewise
      DATA_MODE: ${DATA_MODE:-demo}
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      PORT: 8000
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - api_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  api_data:
